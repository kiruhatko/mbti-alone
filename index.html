<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23140f3d'/%3E%3Ccircle cx='25' cy='27' r='15' fill='%23ff8bd0'/%3E%3Ccircle cx='39' cy='38' r='15' fill='%234fe3ff' opacity='.85'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:dark;
  --ink:#f6f7ff; --ink-2:rgba(236,239,255,.78); --ink-3:rgba(226,230,255,.62);
  --bg-a:#0d0b26; --bg-b:#1a1250; --bg-c:#2b0f5c;
  --glass-top:rgba(255,255,255,.14); --glass-bot:rgba(255,255,255,.05); --rim:rgba(255,255,255,.18);
  --g1:#ff8bd0; --g2:#9d8bff; --g3:#4fe3ff;
  --neg:#ff6aa8; --pos:#3be0b4; --ok:#4ade80; --warn:#ffb340;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
html{background-color:var(--bg-a);
  background-image:radial-gradient(1200px 700px at 10% -10%,var(--bg-c),transparent 60%),radial-gradient(900px 600px at 110% 110%,#0e2748,transparent 60%),linear-gradient(160deg,var(--bg-a),var(--bg-b));
  background-attachment:fixed;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;min-height:100vh;justify-content:center}
.card{border-radius:26px;padding:24px 20px}
.glass{background:linear-gradient(180deg,var(--glass-top),var(--glass-bot));border:1px solid var(--rim);box-shadow:0 18px 50px rgba(5,3,25,.42);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
h1{font-size:28px;line-height:1.15;margin:4px 0}
h2{font-size:20px;margin:0}
h3{font-size:17px;margin:0 0 6px}
.lead{color:var(--ink-2);margin:0;font-size:17px}
.fine{color:var(--ink-3);font-size:14px;margin:6px 0}
.muted{color:var(--ink-3)}.ok{color:var(--ok);font-weight:600}.warn{color:var(--warn);font-weight:600}
.mono,code{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.orb{width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff8,transparent 40%),linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3));box-shadow:0 10px 40px #9d8bff66;margin-bottom:4px}
.orb.dim{filter:grayscale(.7) brightness(.7)}
.facts{text-align:left;margin:4px 0 8px;padding-left:20px;color:var(--ink-2)}
.facts li{margin:6px 0}
.btn{appearance:none;border:1px solid var(--rim);background:rgba(255,255,255,.08);color:var(--ink);border-radius:999px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.35;cursor:default}
.btn.primary{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent;color:#140f3d}
.btn.big{padding:15px 30px;font-size:18px;min-width:220px}
.btn.ghost{background:transparent}
.btn.small{min-height:34px;padding:6px 12px;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.spread{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.quiz{display:flex;flex-direction:column;gap:14px}
.prog{height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3));transition:width .3s}
.qcard{display:flex;flex-direction:column;gap:20px;min-height:340px;justify-content:space-between}
.qmeta{display:flex;justify-content:space-between;color:var(--ink-3);font-size:14px}
.qtext{font-size:22px;line-height:1.35;font-weight:600;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.pt{appearance:none;aspect-ratio:1;min-height:42px;border-radius:50%;border:1.5px solid var(--rim);background:rgba(255,255,255,.06);color:var(--ink);font:600 15px/1 system-ui,sans-serif;cursor:pointer;transition:transform .12s,background .15s}
.pt.neg{border-color:#ff6aa877}.pt.pos{border-color:#3be0b477}
.pt.sel.neg{background:var(--neg);color:#1b0b25}.pt.sel.pos{background:var(--pos);color:#06231b}.pt.sel.zero{background:#b9bcdc;color:#14143a}
.pt.sel{transform:scale(1.1)}
.scale-cap{display:flex;justify-content:space-between;color:var(--ink-3);font-size:13px}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--ink-3)}
.type{font-size:56px;font-weight:800;letter-spacing:.04em;background:linear-gradient(135deg,var(--g1),var(--g2),var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.type small{font-size:24px}
.type.sm{font-size:30px}
.axes{width:100%;display:flex;flex-direction:column;gap:14px;margin-top:8px;text-align:left}
.axhead{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);gap:6px}
.axhead .win{color:var(--ink);font-weight:700}
.axt{text-transform:uppercase;letter-spacing:.08em;font-size:11px;align-self:center}
.track{position:relative;height:10px;border-radius:9px;background:rgba(255,255,255,.1);margin-top:5px;overflow:hidden}
.track i{position:absolute;top:0;bottom:0;border-radius:9px}
.track::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:rgba(255,255,255,.5)}
.status{margin-top:6px;min-height:24px}
textarea.code{width:100%;min-height:90px;margin:8px 0;border-radius:14px;border:1px solid var(--rim);background:rgba(0,0,0,.25);color:var(--ink);padding:10px;font:12px ui-monospace,monospace;word-break:break-all}
.sub{padding:18px}
.btn.big small{display:block;font-size:12px;font-weight:500;opacity:.75;margin-top:2px}
.btn.big{flex-direction:column;gap:0;width:100%;max-width:340px}
.hero{gap:10px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%}
.tile{border-radius:16px;padding:10px 2px;background:rgba(255,255,255,.07);border:1px solid var(--rim);display:flex;flex-direction:column;align-items:center;gap:1px}
.tile .l{font-size:28px;font-weight:800;line-height:1.1;background:linear-gradient(135deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tile small{font-size:9.5px;color:var(--ink-3);text-align:center;line-height:1.2}
.tile em{font-style:normal;font-size:12px;font-weight:700}
.tile.sfx .l{font-size:22px}
.tname{font-size:32px;margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--rim);background:rgba(255,255,255,.06);display:inline-flex;align-items:center;gap:6px}
.chip.warn{color:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.axcard{padding:18px}
.axhead.big{font-size:15px;margin-top:8px}
.axhead b{font-size:17px}
.track.thin{height:6px}
.center-t{text-align:center}
.fgroup{margin-top:16px}
.fgroup h4{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.fgroup h4 i{width:14px;height:6px;border-radius:4px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.facet{margin:10px 0}
.facet .fine{margin:3px 0 0;font-size:12px}
.fns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fn{border-radius:18px;padding:12px;background:rgba(255,255,255,.06);border:1px solid var(--rim)}
.fn small{color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.fn .code{font-size:24px;font-weight:800}
.fn p{margin:4px 0 0}
.two{display:grid;grid-template-columns:1fr;gap:4px}
@media(min-width:520px){.two{grid-template-columns:1fr 1fr}}
h2{margin-bottom:4px}

</style>
</head>

<script>
"use strict";
/* ═════════════ ДАНІ ═════════════
   Питання: [ключ, «про друга», «про себе»].
   ключ +1 — згода тягне до ПЕРШОГО полюса осі (E, S, T, J, A), −1 — до другого.
   У формулюваннях про друга: {S}/{s} він/вона, {G}/{g} його/її, {D}/{d} йому/їй,
   {n} нього/неї (після прийменника), {i} ним/нею (після «з»). */

const AXES = [
  { id:'EI', title:'Енергія',      hint:'Куди спрямована увага й звідки береться енергія',
    a:{ k:'E', name:'Екстраверсія', gen:'екстраверсії' }, b:{ k:'I', name:'Інтроверсія', gen:'інтроверсії' },
    c1:'#ff7ac0', c2:'#ff9a6b' },
  { id:'SN', title:'Сприйняття',   hint:'Як збирається та осмислюється інформація',
    a:{ k:'S', name:'Сенсорика',    gen:'сенсорики' },    b:{ k:'N', name:'Інтуїція',    gen:'інтуїції' },
    c1:'#ffc23d', c2:'#ff8a3d' },
  { id:'TF', title:'Рішення',      hint:'На що спирається вибір: логіка чи цінності',
    a:{ k:'T', name:'Логіка',       gen:'логіки' },       b:{ k:'F', name:'Етика',       gen:'етики' },
    c1:'#35d3ff', c2:'#4a8bff' },
  { id:'JP', title:'Організація',  hint:'Як людина ставиться до планів і порядку',
    a:{ k:'J', name:'Структура',    gen:'структури' },    b:{ k:'P', name:'Гнучкість',   gen:'гнучкості' },
    c1:'#b58bff', c2:'#7a6bff' },
  { id:'AT', title:'Стійкість',    hint:'Додаткова шкала: стрес, впевненість, чутливість', identity:true,
    a:{ k:'A', name:'Стійкість',    gen:'стійкості' },    b:{ k:'T', name:'Чутливість',  gen:'чутливості' },
    c1:'#4ade80', c2:'#22c1a8' },
];
const AXIS = Object.fromEntries(AXES.map(a => [a.id, a]));

const FACETS = [
  { id:'ei1', axis:'EI', name:'Джерело енергії', a:'від людей', b:'на самоті', q:[
    [ 1, 'Після гучної вечірки {s} відчуває приплив сил, а не втому.', 'Після гучної вечірки я відчуваю приплив сил, а не втому.'],
    [-1, 'Після тривалого спілкування {d} потрібно побути на самоті, щоб відновитися.', 'Після тривалого спілкування мені потрібно побути на самоті, щоб відновитися.'],
    [ 1, '{S} краще думає, коли проговорює свої думки вголос з іншими.', 'Я краще думаю, коли проговорюю свої думки вголос з іншими.'],
    [-1, 'Ідеальний вечір для {n} — тиша вдома на самоті або з однією-двома близькими людьми.', 'Ідеальний вечір для мене — тиша вдома на самоті або з однією-двома близькими людьми.'],
    [ 1, 'У великій компанії {s} почувається як риба у воді.', 'У великій компанії я почуваюсь як риба у воді.'],
  ]},
  { id:'ei2', axis:'EI', name:'Експресивність', a:'виразність', b:'стриманість', q:[
    [ 1, '{S} легко починає розмову з незнайомими людьми.', 'Мені легко почати розмову з незнайомою людиною.'],
    [-1, '{S} говорить мало, якщо тема не здається {d} справді важливою.', 'Я говорю мало, якщо тема не здається мені справді важливою.'],
    [ 1, '{S} охоче розповідає про свої справи й почуття навіть малознайомим людям.', 'Я охоче розповідаю про свої справи й почуття навіть малознайомим людям.'],
    [-1, 'Щоб по-справжньому пізнати {g}, потрібен час: {s} відкривається не одразу.', 'Щоб мене по-справжньому пізнати, потрібен час: я відкриваюсь не одразу.'],
    [-1, 'На людях {s} зазвичай стримано виявляє емоції.', 'На людях я зазвичай стримано виявляю емоції.'],
  ]},
  { id:'ei3', axis:'EI', name:'Коло спілкування', a:'широке', b:'вузьке', q:[
    [ 1, 'У {n} дуже багато знайомих і приятелів з різних кіл.', 'У мене дуже багато знайомих і приятелів з різних кіл.'],
    [-1, '{S} має кілька справді близьких людей і не прагне розширювати коло спілкування.', 'Я маю кількох справді близьких людей і не прагну розширювати коло спілкування.'],
    [ 1, 'Зазвичай саме від {n} виходить ініціатива зібратися, зустрітися чи кудись поїхати.', 'Зазвичай саме від мене виходить ініціатива зібратися, зустрітися чи кудись поїхати.'],
    [-1, 'До нових знайомств {s} ставиться обережно й довго придивляється до людей.', 'До нових знайомств я ставлюсь обережно й довго придивляюсь до людей.'],
    [ 1, 'У групових чатах і компаніях {s} зазвичай серед найактивніших.', 'У групових чатах і компаніях я зазвичай серед найактивніших.'],
  ]},
  { id:'ei4', axis:'EI', name:'Увага', a:'на сцені', b:'за лаштунками', q:[
    [ 1, '{S} із задоволенням опиняється в центрі уваги.', 'Я із задоволенням опиняюсь у центрі уваги.'],
    [-1, 'Публічні виступи й пильна увага викликають у {n} радше напругу, ніж азарт.', 'Публічні виступи й пильна увага викликають у мене радше напругу, ніж азарт.'],
    [-1, '{S} краще почувається за лаштунками, ніж на сцені.', 'Я краще почуваюсь за лаштунками, ніж на сцені.'],
    [ 1, 'З {i} стає веселіше: {s} легко «заводить» компанію.', 'Зі мною стає веселіше: я легко «заводжу» компанію.'],
    [-1, '{S} може цілий день майже ні з ким не розмовляти — і {d} це цілком комфортно.', 'Я можу цілий день майже ні з ким не розмовляти — і мені це цілком комфортно.'],
  ]},

  { id:'sn1', axis:'SN', name:'Тип мислення', a:'конкретне', b:'абстрактне', q:[
    [ 1, '{S} віддає перевагу конкретним фактам і прикладам, а не загальним теоріям.', 'Я віддаю перевагу конкретним фактам і прикладам, а не загальним теоріям.'],
    [-1, '{S} із захопленням міркує про абстрактні ідеї: сенс життя, майбутнє, «а що, якби…».', 'Я із захопленням міркую про абстрактні ідеї: сенс життя, майбутнє, «а що, якби…».'],
    [ 1, '{S} довіряє тому, що можна побачити, помацати й перевірити.', 'Я довіряю тому, що можна побачити, помацати й перевірити.'],
    [-1, '{S} помічає зв’язки між, здавалося б, непов’язаними речами й читає «між рядків».', 'Я помічаю зв’язки між, здавалося б, непов’язаними речами й читаю «між рядків».'],
    [ 1, 'Пояснюючи щось, {s} іде від деталей і послідовних кроків, а не від загальної ідеї.', 'Пояснюючи щось, я йду від деталей і послідовних кроків, а не від загальної ідеї.'],
  ]},
  { id:'sn2', axis:'SN', name:'Підхід', a:'практичність', b:'уява', q:[
    [ 1, '{S} мислить практично: що працює тут і зараз, те й добре.', 'Я мислю практично: що працює тут і зараз, те й добре.'],
    [-1, '{S} легко вигадує несподівані, навіть «шалені» ідеї.', 'Я легко вигадую несподівані, навіть «шалені» ідеї.'],
    [ 1, '{S} добре дає раду практичним справам: полагодити, зібрати, розібратися з технікою.', 'Я добре даю раду практичним справам: полагодити, зібрати, розібратися з технікою.'],
    [-1, '{S} часто «літає в хмарах», поринаючи у фантазії чи роздуми.', 'Я часто «літаю в хмарах», поринаючи у фантазії чи роздуми.'],
    [-1, '{G} цікавить те, чого ще немає, але що могло б з’явитися.', 'Мене цікавить те, чого ще немає, але що могло б з’явитися.'],
  ]},
  { id:'sn3', axis:'SN', name:'Фокус', a:'деталі', b:'загальна картина', q:[
    [ 1, '{S} помічає дрібниці: нову зачіску, змінений інтер’єр, невеликі зміни довкола.', 'Я помічаю дрібниці: нову зачіску, змінений інтер’єр, невеликі зміни довкола.'],
    [-1, '{S} більше живе думками про майбутнє й можливості, ніж теперішнім моментом.', 'Я більше живу думками про майбутнє й можливості, ніж теперішнім моментом.'],
    [ 1, '{S} стоїть на землі: краще синиця в руці, ніж журавель у небі.', 'Я стою на землі: краще синиця в руці, ніж журавель у небі.'],
    [-1, 'У розмові {s} часто перестрибує з теми на тему за асоціаціями.', 'У розмові я часто перестрибую з теми на тему за асоціаціями.'],
    [ 1, '{S} добре пам’ятає конкретні факти, дати й подробиці подій.', 'Я добре пам’ятаю конкретні факти, дати й подробиці подій.'],
  ]},
  { id:'sn4', axis:'SN', name:'Ставлення до нового', a:'традиція', b:'новизна', q:[

// Стабільний «перемішаний» порядок: осі чергуються, але в однаковому порядку в обох учасників.
const ORDER = (() => {
  let seed = 20241017;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const byAxis = {};
  QUESTIONS.forEach(q => { (byAxis[q.axis] = byAxis[q.axis] || []).push(q.id); });
  const keyed = [];
  Object.keys(byAxis).forEach(ax => {
    const arr = byAxis[ax];
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    arr.forEach((qi, pos) => keyed.push([(pos + 0.5) / arr.length + (rnd() - 0.5) * 0.03, qi]));
  });
  keyed.sort((x, y) => x[0] - y[0]);
  return keyed.map(k => k[1]);
})();

/* ───────── швидкий тест: 30 тверджень ─────────
   У кожній основній осі 6 тверджень (3 прямі + 3 зворотні), що зачіпають усі 4 грані:
   грань 1: + і −, грань 2: +, грань 3: −, грань 4: + і −. Шкала A/T: 6 тверджень (3 + 3), усього 30. */
const QUICK = (() => {
  const take = (fid, sign) => QUESTIONS.find(q => q.facet === fid && q.key * sign > 0).id;
  const ids = [];
  for (const ax of ['EI', 'SN', 'TF', 'JP']) {
    const f = n => ax.toLowerCase() + n;
    ids.push(take(f(1), 1), take(f(1), -1), take(f(2), 1), take(f(3), -1), take(f(4), 1), take(f(4), -1));
  }
  ids.push(take('at1', 1), take('at1', -1), take('at2', 1), take('at2', -1), take('at3', 1), take('at3', -1));
  return ids.sort((a, b) => a - b);
})();
const QUICK_SET = new Set(QUICK);
const qIds = quick => quick ? QUICK : QUESTIONS.map(q => q.id);
const qOrder = quick => quick ? ORDER.filter(i => QUICK_SET.has(i)) : ORDER;

/* Контрольна сума набору тверджень: якщо порядок чи ключі змінились між версіями сторінки, знімки несумісні. */
const QH = (NQ + QUESTIONS.reduce((t, q) => t + (q.id + 1) * (q.key > 0 ? 3 : 5) + q.axis.charCodeAt(0) + q.facet.charCodeAt(2), 0)) % 9973;

/* ═════════════ ПІДРАХУНОК ═════════════
   Скопійовано без змін з MBTI-source/src/3-core.js (score, pctOf, isFirst, typeOf, pole, altTypes):
   результат рахується рівно так, як у «Дзеркалі MBTI». */
const SKIP = 9;
function score(ans) {
  const ax = {}, fc = {};
  AXES.forEach(a => ax[a.id] = { sum: 0, n: 0 });
  FACETS.forEach(f => fc[f.id] = { sum: 0, n: 0 });
  QUESTIONS.forEach((q, i) => {
    const v = ans[i]; if (v == null || v === SKIP) return;
    ax[q.axis].sum += v * q.key; ax[q.axis].n++;
    fc[q.facet].sum += v * q.key; fc[q.facet].n++;
  });
  const out = { ax: {}, fc: {}, n: {} };
  for (const k in ax) { out.ax[k] = ax[k].n ? ax[k].sum / (3 * ax[k].n) : 0; out.n[k] = ax[k].n; }
  for (const k in fc) { out.fc[k] = fc[k].n ? fc[k].sum / (3 * fc[k].n) : 0; out.n[k] = fc[k].n; }
  return out;
}
const pctOf = s => Math.max(0, Math.min(100, 50 + Math.sign(s) * Math.round(50 * Math.abs(s))));
const isFirst = s => pctOf(s) > 50;
function typeOf(sc) {
  let code = '';
  for (const ax of AXES.slice(0, 4)) code += isFirst(sc.ax[ax.id]) ? ax.a.k : ax.b.k;
  const id = isFirst(sc.ax.AT) ? 'A' : 'T';
  return { code, id, full: code + '-' + id };
}
function pole(ax, s) {
  const first = isFirst(s), p = pctOf(s);
  return { p: ax[first ? 'a' : 'b'], pct: first ? p : 100 - p, first };
}
function altTypes(sc, lim) {
  const base = typeOf(sc).code.split('');
  return AXES.slice(0, 4).map((ax, i) => ({ i, ax, d: Math.abs(sc.ax[ax.id]) }))
    .filter(o => o.d < (lim || 0.2)).sort((x, y) => x.d - y.d).slice(0, 2)
    .map(o => { const c = base.slice(); c[o.i] = isFirst(sc.ax[o.ax.id]) ? o.ax.b.k : o.ax.a.k; return c.join(''); });
}

    <div class="orb"></div>
    <h1>Дзеркало MBTI</h1>
    <p class="lead">Тест на тип особистості. Проходиш сам, результат повний і безкоштовний: тип, 5 шкал, 19 граней характеру, когнітивні функції й опис типу.</p>
    <ul class="facts">
      <li>Оцінюй твердження від <b>−3</b> («зовсім не про мене») до <b>+3</b> («точно про мене»)</li>
      <li>Відповідай так, як є зазвичай, а не як «правильно»</li>
      <li>Прогрес зберігається: можна закрити й продовжити</li>
      <li>Відповіді лишаються лише на твоєму пристрої й нікуди не надсилаються</li>
    </ul>
    ${started ? `<button class="btn primary big" data-act="resume">Продовжити (${n} з ${total()})</button>
      <button class="btn ghost" data-act="reset">Почати спочатку</button>`
    : `<button class="btn primary big" data-act="start" data-q="0">Повний тест · ${NQ} тверджень<small>12–15 хв · точніше</small></button>
      <button class="btn big" data-act="start" data-q="1">Швидкий · ${QUICK.length} тверджень<small>5 хв · орієнтовно</small></button>`}
  </section>`;
}

function quiz() {
  const L = list(), qi = L[S.pos], q = QUESTIONS[qi], cur = S.ans[qi], n = answered(), T = L.length;
  app.innerHTML = `<section class="quiz">
    <div class="prog"><i style="width:${n / T * 100}%"></i></div>
    <div class="card glass qcard">
      <div class="qmeta"><span>${S.pos + 1} з ${T}${S.quick ? ' · швидкий' : ''}</span><span>${Math.round(n / T * 100)}%</span></div>
      <div class="qtext">${esc(q.self)}</div>
      ${S.pos === 0 && n === 0 ? '<p class="fine">−3 — зовсім не про мене, 0 — нейтрально, +3 — точно про мене.</p>' : ''}
      <div class="scale" role="radiogroup" aria-label="Оцінка від −3 до +3">
        ${SCALE.map(v => `<button class="pt ${v < 0 ? 'neg' : v > 0 ? 'pos' : 'zero'} ${cur === v ? 'sel' : ''}" data-act="ans" data-v="${v}" role="radio" aria-checked="${cur === v}" aria-label="${SCALE_LABEL[v]}">${sgn(v)}</button>`).join('')}
      </div>
      <div class="scale-cap"><span>Зовсім ні</span><span>Нейтрально</span><span>Цілком так</span></div>
    </div>
    <div class="row spread"><button class="btn ghost" data-act="prev" ${S.pos === 0 ? 'disabled' : ''}>← Назад</button>
      ${cur != null && S.pos < T - 1 ? '<button class="btn ghost" data-act="next">Далі →</button>' : '<button class="btn ghost" data-act="home">Пауза</button>'}</div>
  </section>`;
}

function confirmView() {
  app.innerHTML = `<section class="card glass center">
    <div class="orb"></div>
    <h1>Готово!</h1>
    <p class="lead">Усі ${total()} відповідей є. Можна ще раз переглянути або одразу дивитися результат.</p>
    <button class="btn primary big" data-act="finish">Показати результат</button>
    <button class="btn ghost" data-act="back-to-quiz">← До питань</button>
  </section>`;
}

/* ───── результат: ті самі блоки й тексти, що в «Дзеркалі MBTI» (самооцінка, без друзів) ───── */
function result() {
  const sc = score(S.quick ? S.ans.map((v, i) => QUICK_SET.has(i) ? v : null) : S.ans);
  const t = typeOf(sc), info = TYPES[t.code], g = GROUPS[groupOf(t.code)];
  const alts = altTypes(sc, borderLim());
  const tiles = AXES.slice(0, 4).map(ax => { const po = pole(ax, sc.ax[ax.id]);
    return `<div class="tile" style="--c1:${ax.c1};--c2:${ax.c2}"><div class="l">${po.p.k}</div><small>${po.p.name}</small><em>${po.pct}%</em></div>`; }).join('');
  const at = pole(AXES[4], sc.ax.AT);
  const axes = AXES.map(ax => {
    const p = pctOf(sc.ax[ax.id]), domA = p > 50, dp = domA ? p : 100 - p, dom = domA ? ax.a : ax.b;
    const strength = dp < 55 ? 'майже порівну' : dp < 65 ? 'помірно' : dp < 78 ? 'виразно' : 'яскраво виражено';
    return `<div class="card glass axcard">
      <div class="axhead"><span class="axt">${ax.title}</span><span class="fine">${ax.hint}</span></div>
      <div class="axhead big"><span class="${domA ? 'win' : ''}"><b>${ax.a.k}</b> ${ax.a.name} ${p}%</span><span class="${domA ? '' : 'win'}">${100 - p}% ${ax.b.name} <b>${ax.b.k}</b></span></div>
      <div class="track"><i style="left:0;width:${p}%;background:linear-gradient(90deg,${ax.c1},${ax.c2})"></i></div>
      <p class="fine"><b style="color:var(--ink)">${dom.name}</b> — ${strength} (${dp}%).${sc.n[ax.id] < 3 ? ' <i>Мало даних для цієї шкали.</i>' : ''}</p>
    </div>`;
  }).join('');
  const border = AXES.slice(0, 4).filter(ax => Math.abs(sc.ax[ax.id]) < borderLim())
    .map(ax => `<li>${ax.a.name} / ${ax.b.name} (${pctOf(sc.ax[ax.id])}% / ${100 - pctOf(sc.ax[ax.id])}%)</li>`);
  const facets = S.quick
    ? `<p class="fine">Грані доступні в повному тесті (${NQ} тверджень): у швидкому на кожну грань припадає лише 1–2 питання, тож показувати їх було б ненадійно.</p>`
    : AXES.map(ax => `<div class="fgroup"><h4 style="--c1:${ax.c1};--c2:${ax.c2}"><i></i>${ax.title} · ${ax.a.k}/${ax.b.k}</h4>` +
        FACETS.filter(f => f.axis === ax.id).map(f => { const p = pctOf(sc.fc[f.id]);
          return `<div class="facet"><div class="axhead"><span class="${p > 50 ? 'win' : ''}">${f.a}</span><span class="axt">${f.name}</span><span class="${p < 50 ? 'win' : ''}">${f.b}</span></div>
            <div class="track thin"><i style="left:0;width:${p}%;background:linear-gradient(90deg,${ax.c1},${ax.c2})"></i></div><div class="fine center-t">${p}% / ${100 - p}%</div></div>`; }).join('') + '</div>').join('');
  const fns = STACK[t.code].split(' ').map((f, i) => `<div class="fn"><small>${STACK_ROLES[i][0]}</small><div class="code" style="color:${g.c}">${f}</div><b>${FN[f].n}</b><p class="fine">${FN[f].d}</p></div>`).join('');

  app.innerHTML = `<section class="card glass center hero" style="--ac:${g.c}">
      <div class="eyebrow">Результат${S.quick ? ' · швидкий тест' : ''}</div>
      <div class="tiles">${tiles}<div class="tile sfx" style="--c1:${AXES[4].c1};--c2:${AXES[4].c2}"><div class="l">-${at.p.k}</div><small>${at.p.name}</small><em>${at.pct}%</em></div></div>
      <h1 class="tname">${info.n}</h1>
      <p class="lead">${info.tag}</p>
      <div class="chips"><span class="chip"><i class="dot" style="background:${g.c}"></i>${g.n}</span><span class="chip">${t.full}</span>
        ${S.quick ? '<span class="chip warn">⚡ орієнтовно</span>' : ''}
        ${alts.length ? `<span class="chip">Може бути також: ${alts.join(' · ')}</span>` : ''}</div>
    </section>
    ${axes}
    ${border.length ? `<section class="card glass"><h2>Де тип може змінитись</h2><p class="fine">Тип тут може «гойдатися» залежно від ситуації або від настрою на момент тесту.</p><ul class="facts">${border.join('')}</ul></section>` : ''}
    <section class="card glass"><h2>Усі грані характеру</h2><p class="fine">Дрібніші шкали всередині кожної осі.</p>${facets}</section>
    <section class="card glass"><h2>Когнітивні функції</h2><p class="fine">За теорією MBTI типовий «стек» для ${t.code}: від найсильнішої функції до найслабшої. Це модель, а не вимір.</p><div class="fns">${fns}</div></section>
    <section class="card glass"><h2>${t.code} · ${info.n}</h2><p class="lead">${info.d}</p>
      <div class="two"><div><h3>Сильні сторони</h3><ul class="facts">${info.pro.map(x => `<li>${x}</li>`).join('')}</ul></div>
        <div><h3>На що звернути увагу</h3><ul class="facts">${info.con.map(x => `<li>${x}</li>`).join('')}</ul></div></div>
      <h3>Як цей тип поводиться в дружбі</h3><p class="lead">${info.fr}</p></section>
    <section class="card glass stack">
      ${navigator.share ? '<button class="btn primary" data-act="share">Поділитися результатом</button>' : ''}
      <button class="btn" data-act="copy">Скопіювати результат</button>
      ${S.quick ? '<button class="btn" data-act="full">Пройти повний тест (відповіді збережуться)</button>' : ''}
      <button class="btn ghost" data-act="reset">Пройти заново</button>
      <p class="fine center-t" id="msg">Відповіді збережено лише на цьому пристрої.</p>
    </section>`;
  RES = { t, info, sc };
}
let RES = null;
function shareText() {
  const { t, info, sc } = RES;
  return `Мій тип за «Дзеркалом MBTI»: ${t.full} — ${info.n}\n${info.tag}\n` +
    AXES.map(ax => { const po = pole(ax, sc.ax[ax.id]); return `${ax.title}: ${po.p.name} ${po.pct}%`; }).join('\n') + '\n\n' + location.origin + location.pathname;
}

/* ───── дії ───── */
let advT = null;
function answer(v) {
  const qi = list()[S.pos];
  S.ans[qi] = v; save();
  document.querySelectorAll('.pt').forEach(b => { const on = +b.dataset.v === v; b.classList.toggle('sel', on); b.setAttribute('aria-checked', on); });
  clearTimeout(advT); advT = setTimeout(advance, 260);
}
function advance() {
  if (S.pos < total() - 1) S.pos++;
  else { const g = firstGap(); if (g == null) S.view = 'confirm'; else S.pos = g; }
  save(); render();
}
const ACT = {
  start(el) { Object.assign(S, blank(), { qh: QH, quick: el.dataset.q === '1', view: 'quiz' }); save(); render(); },
  resume() { const g = firstGap(); S.view = g == null ? 'confirm' : 'quiz'; if (g != null) S.pos = g; save(); render(); },
  reset() { if (!confirm('Почати тест спочатку? Поточні відповіді буде стерто.')) return; S = blank(); S.qh = QH; save(); render(); },
  ans(el) { answer(+el.dataset.v); },
  prev() { clearTimeout(advT); if (S.pos > 0) S.pos--; save(); render(); },
  next() { clearTimeout(advT); advance(); },
  home() { clearTimeout(advT); S.view = 'intro'; save(); render(); },
  'back-to-quiz'() { S.view = 'quiz'; S.pos = total() - 1; save(); render(); },
  finish() { S.done = Date.now(); S.view = 'result'; save(); render(); },
  full() { S.quick = false; S.done = null; const g = firstGap(); S.pos = g || 0; S.view = 'quiz'; save(); render(); },
  async share() { try { await navigator.share({ title: 'Мій тип MBTI', text: shareText() }); } catch (e) { /* скасовано */ } },
  async copy() {
    const m = document.getElementById('msg');
    try { await navigator.clipboard.writeText(shareText()); m.textContent = 'Скопійовано ✓'; }
    catch (e) { m.innerHTML = '<textarea readonly class="code">' + esc(shareText()) + '</textarea>'; }
  },
};
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if (f) f(el);
});
document.addEventListener('keydown', e => {
  if (S.view !== 'quiz' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key >= '1' && e.key <= '7') answer(+e.key - 4);
  else if (e.key === 'ArrowLeft' && S.pos > 0) ACT.prev();
});
render();

</script>
</body>
</html>
